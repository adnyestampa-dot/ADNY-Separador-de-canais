name: Publicar ADNY Separador
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adny-publicacao
  cancel-in-progress: false
jobs:
  windows:
    name: Executaveis Windows e downloads
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Compilar versao Completa
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/adny_separador.spec
      - name: Compilar versao Clean
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/adny_separador_clean.spec
      - name: Conferir exportacao PSD nas duas versoes
        run: python packaging/check_executables.py
      - name: Preparar pacotes e checksums
        run: python packaging/package_release.py
      - name: Publicar downloads gratuitos
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.0 --target $env:GITHUB_SHA --title "ADNY Separador 0.1.0" --notes-file packaging/release_notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v0.1.0 release/ADNY-Separador-Completa-Windows-x64.zip release/ADNY-Separador-Clean-Windows-x64.zip release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  site:
    name: Publicar site no GitHub Pages
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
